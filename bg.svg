    <path d="M304 700 q-60 -10 -80 30 q40 -25 80 -26z M304 700 q60 -10 80 30 q-40 -25 -80 -26z M304 700 q-30 -45 -70 -40 q40 5 70 42z M304 700 q30 -45 70 -40 q-40 5 -70 42z"/>
    <rect x="1050" y="720" width="8" height="180" rx="4"/>
    <path d="M1054 720 q-55 -10 -74 28 q36 -23 74 -24z M1054 720 q55 -10 74 28 q-36 -23 -74 -24z M1054 720 q-28 -42 -64 -36 q36 5 64 38z M1054 720 q28 -42 64 -36 q-36 5 -64 38z"/>
