    <rect x="370" y="540" width="120" height="360"/>
    <rect x="620" y="470" width="80" height="430"/>
    <rect x="710" y="560" width="130" height="340"/>
    <rect x="980" y="520" width="90" height="380"/>
    <rect x="1080" y="430" width="70" height="470"/>
    <rect x="1160" y="560" width="120" height="340"/>
    <rect x="1290" y="490" width="80" height="410"/>
    <rect x="1380" y="580" width="60" height="320"/>
  </g>

  <!-- جامع: قبة ومئذنة -->
  <g fill="#9CC7B9">
    <rect x="860" y="600" width="140" height="300"/>
    <path d="M870 600 a60 60 0 0 1 120 0z"/>
    <rect x="1010" y="440" width="26" height="460"/>
    <path d="M1004 440 h38 l-19 -40z"/>
    <rect x="1006" y="500" width="34" height="8"/>
    <circle cx="930" cy="536" r="5"/>
  </g>

  <!-- الصف القريب: عمارات بشبابيك -->
  <g>
    <rect x="40" y="640" width="150" height="260" fill="#7FB5A3"/>
    <rect x="40" y="640" width="150" height="260" fill="url(#win)"/>
    <rect x="210" y="580" width="110" height="320" fill="#6FAA97"/>
    <rect x="210" y="580" width="110" height="320" fill="url(#win2)"/>
    <rect x="460" y="610" width="160" height="290" fill="#78B09E"/>
    <rect x="460" y="610" width="160" height="290" fill="url(#win)"/>
    <rect x="640" y="660" width="120" height="240" fill="#6FAA97"/>
    <rect x="640" y="660" width="120" height="240" fill="url(#win2)"/>
    <rect x="1100" y="620" width="140" height="280" fill="#78B09E"/>
    <rect x="1100" y="620" width="140" height="280" fill="url(#win)"/>
