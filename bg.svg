<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDEFEA"/>
      <stop offset=".55" stop-color="#EEF5F2"/>
      <stop offset="1" stop-color="#F7F4EC"/>
    </linearGradient>
    <radialGradient id="sun" cx=".78" cy=".22" r=".35">
      <stop offset="0" stop-color="#FFE7B8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFE7B8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="win" width="22" height="26" patternUnits="userSpaceOnUse">
      <rect x="6" y="6" width="10" height="12" rx="1.5" fill="#FFFFFF" opacity=".55"/>
    </pattern>
    <pattern id="win2" width="18" height="22" patternUnits="userSpaceOnUse">
      <rect x="5" y="5" width="8" height="10" rx="1" fill="#FFFFFF" opacity=".45"/>
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="url(#sky)"/>
  <rect width="1440" height="900" fill="url(#sun)"/>
  <circle cx="1120" cy="200" r="70" fill="#FFF1D2" opacity=".8"/>

  <!-- غيوم -->
  <g fill="#FFFFFF" opacity=".7">
